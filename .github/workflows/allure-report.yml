name: TransLink API Tests and Allure Report

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: Java API Automation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Execute JUnit Tests
        id: tests
        continue-on-error: true
        env:
          TRANSLINK_API_KEY: ${{ secrets.TRANSLINK_API_KEY }}
        run: mvn --batch-mode clean test

      - name: Generate Allure HTML Report
        if: always()
        run: |
          if [ -d "allure-results" ]; then
            npx --yes allure@3.33.0 generate \
              ./allure-results \
              --output ./allure-report
          else
            echo "No Allure results found."
          fi

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translink-allure-report
          path: allure-report/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload JUnit Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translink-junit-results
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce Test Result
        if: steps.tests.outcome == 'failure'
        run: exit 1
